server:
  port: 8847

spring:
  application:
    name: shop-product
  config:
    import: nacos:shop-product.yml?refreshEnabled=true
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER:localhost:8976}
      config:
        namespace: ${NACOS_NAMESPACE:dev}
        group: DEFAULT_GROUP
      discovery:
        namespace: ${NACOS_NAMESPACE:dev}
    # Sentinel 配置（RL-02 引入）
    # transport.dashboard：Sentinel Dashboard 地址，RL-04 部署后启用，未部署时控制台不可用但不影响限流
    # transport.port：Sentinel 客户端与 Dashboard 通信的端口，默认 8719，冲突时自动+1
    # eager：true 表示服务启动时就初始化 Sentinel，而不是等到第一次请求
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:localhost:8858}
        port: ${SENTINEL_PORT:8719}
      eager: true
      # Sentinel 数据源 Nacos 持久化（RL-05 引入）
      # 小白理解：以前限流规则写在代码里（SentinelRuleConfig.java），改规则要重新打包部署；
      # 现在规则存在 Nacos 配置中心，改规则不用重启服务，Nacos 修改后自动推送到服务生效。
      # flow：限流规则（QPS 超限就拒绝请求）
      # degrade：熔断降级规则（异常率/慢调用超阈值就熔断）
      # data-id 使用 ${spring.application.name} 占位符，每个服务读取自己的规则文件
      datasource:
        # 限流规则数据源
        flow:
          nacos:
            server-addr: ${NACOS_SERVER:localhost:8976}
            namespace: ${NACOS_NAMESPACE:dev}
            group-id: SENTINEL_GROUP
            data-id: ${spring.application.name}-flow-rules.json
            rule-type: flow
        # 熔断降级规则数据源（当前为空，后续 RL-06 配置）
        degrade:
          nacos:
            server-addr: ${NACOS_SERVER:localhost:8976}
            namespace: ${NACOS_NAMESPACE:dev}
            group-id: SENTINEL_GROUP
            data-id: ${spring.application.name}-degrade-rules.json
            rule-type: degrade
        # 热点参数限流规则数据源（RL-12 引入）
        # 小白理解：普通限流是"整个接口每秒最多500次"，不管你访问哪个商品；
        # 热点参数限流是"单个商品每秒最多500次"，爆款商品可以单独配更高阈值。
        # 比如 ID=10086 的爆款球鞋配 2000 QPS，其他普通商品都是 500 QPS。
        param-flow:
          nacos:
            server-addr: ${NACOS_SERVER:localhost:8976}
            namespace: ${NACOS_NAMESPACE:dev}
            group-id: SENTINEL_GROUP
            data-id: ${spring.application.name}-param-rules.json
            rule-type: param-flow
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:4306}/shop_product?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

sa-token:
  token-name: Authorization
  timeout: 2592000
  active-timeout: 86400
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-log: false

# Elasticsearch配置
elasticsearch:
  host: ${ES_HOST:localhost}
  port: ${ES_PORT:9201}
  scheme: http

# RocketMQ配置
rocketmq:
  name-server: ${ROCKETMQ_NAMESRV:localhost:9977}
  producer:
    group: product-producer-group
    send-message-timeout: 3000
    retry-times-when-send-failed: 2

# Feign 整合 Sentinel：开启后 Feign 调用失败会走 fallbackFactory 降级逻辑（RL-03 引入）
feign:
  sentinel:
    enabled: true
