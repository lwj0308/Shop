# 商品服务独立配置
# 在Nacos中配置为：Data ID = shop-product.yml, Group = DEFAULT_GROUP, Namespace = dev

server:
  port: 8847

spring:
  application:
    name: shop-product

# Elasticsearch配置（搜索引擎，用来做商品搜索）
elasticsearch:
  host: ${ES_HOST:localhost}
  port: ${ES_PORT:9201}
  # 商品索引名称（相当于数据库里的表名）
  index-name: product_index

# Caffeine本地缓存配置（在JVM内存里缓存热点数据，减少数据库查询）
cache:
  caffeine:
    # maximumSize=1000：最多缓存1000条数据
    # expireAfterWrite=60s：写入60秒后自动过期
    spec: maximumSize=1000,expireAfterWrite=60s

# 内部接口密钥（InnerApiInterceptor 校验 X-Inner-Key，服务间 Feign 调用自动携带）
# 源码已去掉默认值：漏配或留空都会导致服务启动失败，不再静默退回公开密钥。
# 生成方式：openssl rand -hex 24 ；所有服务必须使用同一个值，否则 Feign 互调会 403。
# 真实密钥只写在配置中心，不要提交进仓库，所以这里只引用环境变量。
shop:
  security:
    inner-key: ${SHOP_INNER_KEY:}
