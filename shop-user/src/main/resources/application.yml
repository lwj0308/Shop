server:
  port: 8845
  # Tomcat 线程池配置（RL-07 引入）
  # 小白理解：Tomcat 是处理 HTTP 请求的容器，max-threads 是同时处理请求的线程数，
  # max-connections 是同时保持的连接数，accept-count 是连接满后排队等待的最大数量。
  tomcat:
    # 最大工作线程数（默认200，足够应对大部分场景）
    max-threads: 200
    # 最大连接数（默认8192，允许同时保持的TCP连接数）
    max-connections: 8192
    # 接收队列长度（连接数超max-connections后，最多再排100个等待）
    accept-count: 100

spring:
  application:
    name: shop-user
  # 激活dev环境（logback和Nacos配置都依赖这个profile）
  profiles:
    active: dev
  # 使用spring.config.import方式加载Nacos配置
  config:
    import: nacos:shop-user.yml?refreshEnabled=true
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER:localhost:8976}
      config:
        namespace: ${NACOS_NAMESPACE:dev}
        group: DEFAULT_GROUP
      discovery:
        namespace: ${NACOS_NAMESPACE:dev}
    # Sentinel 配置（RL-03 引入）
    # transport.dashboard：Sentinel Dashboard 地址，RL-04 部署后启用，未部署时不影响限流
    # transport.port：Sentinel 客户端与 Dashboard 通信的端口，默认 8719，冲突时自动+1
    # eager：true 表示服务启动时就初始化 Sentinel
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:localhost:8858}
        port: ${SENTINEL_PORT:8719}
      eager: true
  # 数据源配置（HikariCP连接池，Spring Boot默认自带）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:4306}/shop_user?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    hikari:
      # 连接池最大连接数
      maximum-pool-size: 20
      # 最小空闲连接数
      minimum-idle: 5
      # 连接超时时间（毫秒）
      connection-timeout: 30000
      # 空闲连接存活最大时间（毫秒）
      idle-timeout: 600000
      # 连接最大存活时间（毫秒）
      max-lifetime: 1800000

  # Redis 配置（RL-07 补充 Lettuce 连接池）
  # 小白理解：Redis 连接池就像停车场，max-active 是车位总数，max-idle 是长期保留的车位，
  # min-idle 是最低保留车位。请求来了从池子里拿连接，用完归还，避免每次都新建连接。
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 0
      timeout: 5000
      # Lettuce 连接池配置（需要 commons-pool2 依赖，已在 pom.xml 引入）
      lettuce:
        pool:
          # 连接池最大活跃连接数（同时最多16个连接）
          max-active: 16
          # 最大空闲连接数（8个连接闲置保留）
          max-idle: 8
          # 最小空闲连接数（始终保留2个连接待命）
          min-idle: 2
          # 获取连接最大等待时间（毫秒）
          max-wait: 5000ms

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    # 开启驼峰命名转换：数据库的user_name会自动映射到Java的userName
    map-underscore-to-camel-case: true
    # 日志输出：开发时可以看到执行的SQL语句
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 主键生成策略：使用雪花算法生成分布式唯一ID
      id-type: assign_id
      # 逻辑删除字段名
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Sa-Token 配置
sa-token:
  # Token名称（同时也是Cookie名称和Header提交时的key）
  token-name: Authorization
  # AccessToken有效期：2小时（单位：秒），日常接口请求用这个Token
  timeout: 7200
  # Token活动有效期：30分钟无操作就过期（单位：秒），防止用户离开电脑后Token被盗用
  active-timeout: 1800
  # 是否允许同一账号并发登录（比如手机和电脑同时登录）
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个Token
  is-share: false
  # Token风格：uuid
  token-style: uuid
  # 是否输出操作日志
  is-log: false
  # Token前缀（前端提交Token时要带上这个前缀，比如"Bearer xxx"）
  token-prefix: Bearer

# Feign 整合 Sentinel：开启后 Feign 调用失败会走 fallbackFactory 降级逻辑（RL-03 引入）
feign:
  sentinel:
    enabled: true
