server:
  port: 8844

spring:
  application:
    name: shop-gateway
  # 激活dev环境（logback和Nacos配置都依赖这个profile）
  profiles:
    active: dev
  # 强制使用WebFlux响应式模式（Gateway基于WebFlux，不能用Spring MVC）
  # 父POM继承了spring-boot-starter-web，这里必须显式指定reactive模式
  main:
    web-application-type: reactive
  # 使用spring.config.import方式加载Nacos配置（Spring Boot 4的新方式，不再用bootstrap.yml）
  config:
    import: nacos:shop-gateway.yml?refreshEnabled=true
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER:localhost:8976}
      config:
        namespace: ${NACOS_NAMESPACE:dev}
        group: DEFAULT_GROUP
      discovery:
        namespace: ${NACOS_NAMESPACE:dev}
    # 网关路由配置：定义请求如何转发到各个微服务
    # 注意：Spring Cloud Gateway 5.x（Spring Cloud 2025.1.0）改了配置前缀
    # 旧前缀 spring.cloud.gateway.routes 已废弃，必须用 spring.cloud.gateway.server.webflux.routes
    # 否则路由不会被加载，所有请求都会返回 404
    gateway:
      server:
        webflux:
          routes:
            # 用户服务路由：前端访问 /api/user/** 的请求会转发到 shop-user 服务
            - id: shop-user
              uri: lb://shop-user
              predicates:
                - Path=/api/user/**
              filters:
                # StripPrefix=1 表示去掉路径的第一段（/api），转发给后端的路径保留 /user/xxx
                - StripPrefix=1

            # 商家服务路由
            - id: shop-merchant
              uri: lb://shop-merchant
              predicates:
                - Path=/api/merchant/**
              filters:
                # StripPrefix=1 表示去掉路径的第一段（/api），转发给后端的路径保留 /merchant/xxx
                - StripPrefix=1

            # 商品服务路由
            - id: shop-product
              uri: lb://shop-product
              predicates:
                - Path=/api/product/**
              filters:
                - StripPrefix=1

            # 购物车服务路由
            - id: shop-cart
              uri: lb://shop-cart
              predicates:
                - Path=/api/cart/**
              filters:
                - StripPrefix=1

            # 订单服务路由
            - id: shop-order
              uri: lb://shop-order
              predicates:
                - Path=/api/order/**
              filters:
                - StripPrefix=1

            # 支付服务路由
            - id: shop-payment
              uri: lb://shop-payment
              predicates:
                - Path=/api/payment/**
              filters:
                - StripPrefix=1

            # 管理后台路由：前端访问 /api/admin/** 的请求会转发到 shop-admin 服务
            - id: shop-admin
              uri: lb://shop-admin
              predicates:
                - Path=/api/admin/**
              filters:
                - StripPrefix=1

            # 营销服务路由：优惠券、满减活动
            - id: shop-marketing
              uri: lb://shop-marketing
              predicates:
                - Path=/api/marketing/**
              filters:
                - StripPrefix=1

            # 秒杀服务路由：秒杀活动
            - id: shop-seckill
              uri: lb://shop-seckill
              predicates:
                - Path=/api/seckill/**
              filters:
                - StripPrefix=1

# ==================== 网关自定义配置 ====================
gateway:
  # 完全公开的白名单路径（不需要登录就能访问）
  # 支持Ant风格路径匹配：? 匹配一个字符，* 匹配一层，** 匹配任意层
  whitelist:
    - /api/user/auth/login
    - /api/user/auth/register
    - /api/user/auth/captcha
    - /api/user/auth/sms-code
    - /api/merchant/auth/login
    - /api/admin/auth/login
    - /api/admin/auth/captcha
    # 商品浏览相关接口：公开访问，不需要登录
    - /api/product/list
    - /api/product/*              # 商品详情（如 /api/product/123），只匹配一层路径
    - /api/product/search
    - /api/product/suggest        # 搜索建议（输入框联想）
    - /api/product/hot-keywords   # 热门搜索词
    - /api/product/recommend/**   # 商品推荐（热销/新品/相关/猜你喜欢）
    - /api/product/category/**
    - /api/product/brand/**
    - /api/product/comment/**
    # 营销相关公开接口：优惠券列表、满减活动展示
    - /api/marketing/coupon/public/**
    # 秒杀活动公开接口：秒杀列表、活动详情（抢购需要登录）
    - /api/seckill/public/**
    - /api/seckill/list
    - /api/seckill/*
  # 仅限登录用户的白名单路径（需要登录，但不需要特定角色）
  auth-whitelist: []
  # 跨域配置
  cors:
    # 生产环境允许的前端域名（多个用逗号分隔）
    allowed-origins: http://localhost:3000,http://localhost:8080
  # 限流配置（Redis + Lua 双算法实现，详见 RateLimitFilter）
  # 算法选型：
  #   - sliding-window（ZSet 精确滑动窗口）：低频高精度场景，如认证 5 QPS、评论 3 QPS
  #   - token-bucket（令牌桶）：高频接口，如秒杀、下单、商品浏览，允许合理突发
  rate-limit:
    # 限流总开关：true=启用，false=关闭（调试时可临时关闭）
    enabled: true
    # 默认IP级别QPS：每个IP每秒允许的最大请求数
    # 对 sliding-window = 每秒最大请求数；对 token-bucket = 令牌生成速率
    default-ip-qps: 50
    # 默认接口级别QPS：每个接口每秒允许的最大请求数
    default-path-qps: 200
    # 默认限流算法：token-bucket（高频场景多，默认令牌桶）
    default-algorithm: token-bucket
    # 默认令牌桶容量（仅 token-bucket 算法生效，突发上限）
    default-capacity: 100
    # 自定义限流规则（按路径匹配，匹配到的优先使用规则中的QPS）
    # 排在前面的规则优先匹配，没匹配到的使用默认值
    rules:
      # 认证接口：低频高精度，用 ZSet 滑动窗口，防止密码爆破和短信轰炸
      - path-pattern: /api/user/auth/**
        algorithm: sliding-window
        ip-qps: 5
        path-qps: 50
      - path-pattern: /api/merchant/auth/**
        algorithm: sliding-window
        ip-qps: 5
        path-qps: 50
      - path-pattern: /api/admin/auth/**
        algorithm: sliding-window
        ip-qps: 5
        path-qps: 50
      # 秒杀接口：令牌桶，IP 速率 3 令牌/秒（防刷单），桶容量 5（允许短时突发）
      # 接口维度 1000 令牌/秒，桶容量 1000（允许高并发）
      # user-qps=3（RL-10）：登录用户每秒最多3次，防止代理池绕过IP限流
      - path-pattern: /api/seckill/grab/**
        algorithm: token-bucket
        ip-qps: 3
        path-qps: 1000
        capacity: 5
        user-qps: 3
      # 下单支付接口：令牌桶，允许短时突发（如双击提交）
      # user-qps=10（RL-10）：登录用户每秒最多10次下单
      - path-pattern: /api/order/**
        algorithm: token-bucket
        ip-qps: 10
        path-qps: 100
        capacity: 20
        user-qps: 10
      - path-pattern: /api/payment/**
        algorithm: token-bucket
        ip-qps: 10
        path-qps: 100
        capacity: 20
        user-qps: 10
      # 评论提交接口：低频高精度，用 ZSet 滑动窗口，防止刷评
      # user-qps=3（RL-10）：登录用户每秒最多3次评论
      - path-pattern: /api/product/comment/create
        algorithm: sliding-window
        ip-qps: 3
        path-qps: 50
        user-qps: 3

  # ==================== 黑白名单配置（RL-11 引入）====================
  # 小白理解：
  # - 黑名单：名单上的IP/用户直接返回403，不允许访问
  # - 白名单：名单上的IP/用户跳过限流，直接放行
  # - 自动拉黑：触发限流10次后，自动拉黑1小时
  blacklist:
    # IP 黑名单（初始为空，运行时通过 Redis Set 动态管理）
    ip-blacklist: []
    # 用户 ID 黑名单
    user-blacklist: []
    # IP 白名单（内部服务器、监控探针等可加入）
    ip-whitelist: []
    # 用户 ID 白名单（管理员、测试账号等可加入）
    user-whitelist: []
    # 自动拉黑阈值：触发限流超过此次数后自动拉黑（0=禁用）
    auto-block-threshold: 10
    # 自动拉黑时长（秒），默认1小时
    auto-block-duration: 3600

# Sa-Token 配置
sa-token:
  # token名称（同时也是Cookie名称和提交参数名称）
  token-name: Authorization
  # token有效期（单位：秒），默认30天，-1代表永不过期
  timeout: 2592000
  # token临时有效期（指定时间内无操作就视为过期，单位：秒）
  active-timeout: 86400
  # 是否允许同一账号多地同时登录
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个token
  is-share: true
  # token风格（uuid、simple-uuid、random-32、random-64、random-128、tik）
  token-style: uuid
  # 是否输出操作日志
  is-log: false

# ==================== 日志级别配置 ====================
logging:
  level:
    root: INFO
    # 网关过滤器日志级别（开发时可以设为DEBUG查看详细过滤过程）
    com.shop.gateway.filter: DEBUG
    # Spring Cloud Gateway 路由日志（开启DEBUG查看路由匹配过程）
    org.springframework.cloud.gateway: DEBUG
    # Sa-Token 日志
    cn.dev33.satoken: WARN

# ==================== Actuator 端点配置 ====================
management:
  endpoints:
    web:
      exposure:
        include: gateway,health,info
  endpoint:
    gateway:
      access: read-only
